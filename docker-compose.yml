services:
  postgres:
    image: postgres:17-alpine
    container_name: online-store-postgres
    environment:
      POSTGRES_USER: ${DATABASE_USER:-online_store}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-online_store}
      POSTGRES_DB: ${DATABASE_NAME:-online_store}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-online_store} -d ${DATABASE_NAME:-online_store}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: online-store-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER:-online_store}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-online_store}
      DATABASE_NAME: ${DATABASE_NAME:-online_store}
      DATABASE_SSL: "false"
      DATABASE_LOGGING: "false"
    ports:
      - "3000:3000"

volumes:
  postgres_data:
